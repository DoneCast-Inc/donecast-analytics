name: History verify (read-only)
# Answers one question: is the historical analytics data in R2 actually
# REACHABLE through the live API, and does the show registry line up with it?
#
# STRICTLY READ-ONLY. Every Cloudflare call is a GET. Every OP3 admin/data call
# uses operationKind "select", which the worker only ever reads with. No
# update/delete/clear/rebuild/enqueue/backup-write appears anywhere in this file.
#
# NOTE: /api/1/hits is deliberately never queried here. A hits query with an
# early start date walks every minute file in R2 and trips the worker subrequest
# limit (self-DoS). The stats/ endpoints below read rolled-up blobs instead.
on:
  workflow_dispatch:
  # The workflow_dispatch REST endpoint only resolves workflow files that exist
  # on the default branch, so this branch-scoped push trigger is what actually
  # lets the job run from here. Deleted once the verification has run.
  push:
    branches: [claude/slack-session-9d7l6b]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ADMIN_TOKENS: ${{ secrets.ADMIN_TOKENS }}
    steps:
      - name: Verify
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          ORIGIN=https://analytics.donecast.com
          BUCKET=analytics-blobs
          KNOWN_UUID=0cefce1bedc841829243206679bc37cd
          WORK=$(mktemp -d)

          # First comma-separated value only. Never echoed anywhere.
          ADMIN_TOKEN=$(printf '%s' "${ADMIN_TOKENS:-}" | cut -d, -f1 | tr -d '[:space:]')
          if [ -n "$ADMIN_TOKEN" ]; then
            echo "::add-mask::$ADMIN_TOKEN"
            echo "(admin token present: yes, length ${#ADMIN_TOKEN})"
          else
            echo "(admin token present: NO -- authenticated probes will be skipped)"
          fi

          cfauth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          aauth=(-H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json")
          # Every request is bounded: a slow/overloaded worker must not hang the job.
          T=(-m 30 --connect-timeout 10)

          trunc() { head -c 1500; echo; }

          echo "############################################################"
          echo "### SECTION 0 - live instance identity"
          echo "############################################################"
          curl -sS "${T[@]}" -w $'\n[http %{http_code}]\n' "$ORIGIN/info.json" | trunc

          echo
          echo "############################################################"
          echo "### SECTION 1 - full show registry (admin select /show/shows)"
          echo "############################################################"
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "(no admin token -- skipped)"
            : > "$WORK/registry-uuids.txt"
          else
            curl -sS "${T[@]}" -o "$WORK/shows.json" -w '[http %{http_code}]\n' -X POST "${aauth[@]}" \
              --data '{"operationKind":"select","targetPath":"/show/shows","parameters":{"limit":"50"}}' \
              "$ORIGIN/api/1/admin/data"
            echo "--- raw (truncated) ---"
            head -c 3000 "$WORK/shows.json"; echo
            echo "--- parsed: uuid | title | podcastGuid ---"
            jq -r '(.results // []) | .[] | "\(.uuid)\t\(.title // "<no title>")\t\(.podcastGuid // "<no podcastGuid>")"' \
              "$WORK/shows.json" 2>/dev/null || echo "(unparseable)"
            echo "--- registry show count ---"
            jq -r '(.results // []) | length' "$WORK/shows.json" 2>/dev/null || echo "(unparseable)"
            echo "--- is there a show titled like 'Cinema IRL'? ---"
            jq -r '[(.results // [])[] | select((.title // "") | ascii_downcase | test("cinema"))] | if length == 0 then "NO MATCH for /cinema/i in the registry" else (.[] | "MATCH: \(.uuid) \(.title)") end' \
              "$WORK/shows.json" 2>/dev/null || echo "(unparseable)"
          fi

          echo
          echo "############################################################"
          echo "### SECTION 2 - R2 prefixes that hold per-show history"
          echo "############################################################"
          # Page through a prefix (GET only), appending every key to $2.
          list_prefix() {
            local prefix="$1" out="$2" maxpages="${3:-8}"
            local cursor='' page=1 url body code n
            : > "$out"
            while [ "$page" -le "$maxpages" ]; do
              url="$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/objects?per_page=100&prefix=$prefix"
              [ -n "$cursor" ] && url="$url&cursor=$cursor"
              body=$(curl -sS "${T[@]}" -w $'\n%{http_code}' "${cfauth[@]}" "$url" 2>&1)
              code=$(printf '%s' "$body" | tail -n1)
              body=$(printf '%s' "$body" | sed '$d')
              n=$(printf '%s' "$body" | jq -r '((.result // []) | if type=="object" then .objects else . end | length) // 0' 2>/dev/null)
              echo "  page $page [http $code] keys=${n:-parse-failed}"
              if [ "${n:-0}" = "0" ] || [ "${n:-null}" = "null" ]; then
                printf '%s\n' "$body" | head -c 500; echo
                break
              fi
              printf '%s' "$body" | jq -r '(.result // []) | (if type=="object" then .objects else . end) | .[]? | "\(.key // .name)\t\(.size // "?")\t\(.uploaded // .last_modified // "?")"' >> "$out" 2>/dev/null
              cursor=$(printf '%s' "$body" | jq -r '.result_info.cursor // ""' 2>/dev/null)
              [ -z "$cursor" ] || [ "$cursor" = "null" ] && break
              page=$((page+1))
            done
            echo "  total keys collected: $(wc -l < "$out")"
          }

          for P in "stats/audience-summaries/show/" "stats/summaries/show/" "stats/downloads/show-daily/" "stats/show-download-counts/"; do
            SAFE=$(printf '%s' "$P" | tr '/' '_')
            echo
            echo "=== prefix $P ==="
            list_prefix "$P" "$WORK/keys$SAFE.txt"
            echo "--- sample keys ---"
            head -8 "$WORK/keys$SAFE.txt"
            echo "--- distinct show uuids under this prefix (uuid: object count) ---"
            cut -f1 "$WORK/keys$SAFE.txt" | grep -oE '[0-9a-f]{32}' | sort -u > "$WORK/u$SAFE.txt" || true
            while read -r U; do
              [ -z "$U" ] && continue
              C=$(grep -c "$U" "$WORK/keys$SAFE.txt" || true)
              MONTHS=$(grep "$U" "$WORK/keys$SAFE.txt" | grep -oE '[0-9]{4}-[0-9]{2}' | sort -u | tr '\n' ' ')
              echo "  $U -> $C object(s); periods: ${MONTHS:-<none>}"
            done < "$WORK/u$SAFE.txt"
          done

          echo
          echo "--- ALL distinct show uuids with R2 history (any stats prefix) ---"
          cat "$WORK"/u*.txt 2>/dev/null | sort -u > "$WORK/history-uuids.txt" || true
          cat "$WORK/history-uuids.txt"

          echo
          echo "############################################################"
          echo "### SECTION 3 - can that history be read back through the API?"
          echo "############################################################"
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "(no admin token -- skipped)"
          else
            probe() {
              echo "--- GET $1"
              curl -sS "${T[@]}" -w $'\n[http %{http_code}]\n' "$ORIGIN$2" | trunc
              echo
            }
            # Known uuid first, then registry uuids, then everything else found in
            # R2. Capped so a large R2 history can't stretch the job past its
            # timeout -- 7 probes per uuid adds up fast.
            { echo "$KNOWN_UUID"; jq -r '(.results // [])[].uuid' "$WORK/shows.json" 2>/dev/null; \
              cat "$WORK/history-uuids.txt" 2>/dev/null; } | awk 'NF && !seen[$0]++' > "$WORK/all-probe-uuids.txt"
            echo "probe candidates: $(wc -l < "$WORK/all-probe-uuids.txt") (probing at most 8)"
            head -8 "$WORK/all-probe-uuids.txt" > "$WORK/probe-uuids.txt"
            while read -r U; do
              [ -z "$U" ] && continue
              echo "=================================================="
              echo "===== SHOW $U"
              echo "=================================================="
              probe "/api/1/shows/$U" "/api/1/shows/$U?token=$ADMIN_TOKEN"
              probe "/api/1/downloads/show/$U?start=2026-06&end=2026-09&limit=10&format=json" \
                    "/api/1/downloads/show/$U?start=2026-06&end=2026-09&limit=10&format=json&token=$ADMIN_TOKEN"
              probe "/api/1/queries/show-daily-downloads?showUuid=$U" \
                    "/api/1/queries/show-daily-downloads?showUuid=$U&token=$ADMIN_TOKEN"
              probe "/api/1/queries/show-download-counts?showUuid=$U" \
                    "/api/1/queries/show-download-counts?showUuid=$U&token=$ADMIN_TOKEN"
              probe "/api/1/queries/top-countries-for-show?showUuid=$U" \
                    "/api/1/queries/top-countries-for-show?showUuid=$U&token=$ADMIN_TOKEN"
              probe "/api/1/shows/$U/stats" "/api/1/shows/$U/stats?token=$ADMIN_TOKEN"
              probe "/api/1/shows/$U/summary-stats" "/api/1/shows/$U/summary-stats?token=$ADMIN_TOKEN"
            done < "$WORK/probe-uuids.txt"

            echo "############################################################"
            echo "### SECTION 3b - does the show server know the historical uuid?"
            echo "############################################################"
            echo "--- admin select /show/shows/$KNOWN_UUID ---"
            curl -sS "${T[@]}" -w $'\n[http %{http_code}]\n' -X POST "${aauth[@]}" \
              --data "{\"operationKind\":\"select\",\"targetPath\":\"/show/shows/$KNOWN_UUID\"}" \
              "$ORIGIN/api/1/admin/data" | trunc
            echo "--- admin select /show/feeds (limit 25) ---"
            curl -sS "${T[@]}" -w $'\n[http %{http_code}]\n' -X POST "${aauth[@]}" \
              --data '{"operationKind":"select","targetPath":"/show/feeds","parameters":{"limit":"25"}}' \
              "$ORIGIN/api/1/admin/data" | head -c 4000
            echo
            echo "--- admin select /show/show-uuids ---"
            curl -sS "${T[@]}" -w $'\n[http %{http_code}]\n' -X POST "${aauth[@]}" \
              --data '{"operationKind":"select","targetPath":"/show/show-uuids"}' \
              "$ORIGIN/api/1/admin/data" | trunc
          fi

          echo
          echo "=== DONE ==="
