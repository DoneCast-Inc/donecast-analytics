name: Deploy on push
# workflow_dispatch exists for secret rotation: the worker only picks up
# changed secret bindings (adminTokens/previewTokens) on a deploy, and
# deploy.sh early-exits when the deployed SHA already matches.
on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  DEPLOY_FROM: github
  DEPLOY_REPOSITORY_URL: ${{ github.repositoryUrl }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  deploy-prod:
    runs-on: ubuntu-22.04
    env:
      # A manual dispatch is always a forced deploy — that's the whole point
      # of dispatching: rebinding rotated secrets without a code change.
      #
      # It used to try `cond && '' || github.sha` to blank DEPLOY_SHA, but in
      # GitHub expressions '' is falsy, so the || branch always won and every
      # dispatch early-exited with "already deployed" (2026-09-08: a rotated
      # admin token was never bound and the old one stayed live). A separate
      # boolean is unambiguous.
      DEPLOY_SHA: ${{ github.sha }}
      FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Deploy to prod
        run: ./deploy.sh
        env:
          CF_CUSTOM_DOMAIN: analytics.donecast.com
          CF_SCRIPT_NAME: op3-donecast
          CF_BACKEND_DO_NAMESPACE: ${{ secrets.CF_BACKEND_DO_NAMESPACE }}
          CF_BACKEND_SQL_DO_NAMESPACE: ${{ secrets.CF_BACKEND_SQL_DO_NAMESPACE }}
          INSTANCE: prod
          ADMIN_TOKENS: ${{ secrets.ADMIN_TOKENS || 'optional' }}
          PREVIEW_TOKENS: ${{ secrets.PREVIEW_TOKENS || 'optional' }}
          # Storage + ingestion backend. Without these the worker redirects but
          # never RECORDS a download: HitsController/ShowController throw without
          # blobsBucket, and the recording path is skipped when queue2 is unbound.
          # Podcast Index API credentials (apiKey:apiSecret). deploy.sh only binds
          # podcastIndexCredentials when this is non-empty, so an unset secret is a
          # no-op for the deploy — but the show server needs the binding for feed
          # lookups, and never received it because it wasn't passed through here.
          PODCAST_INDEX_CREDENTIALS: ${{ secrets.PODCAST_INDEX_CREDENTIALS }}
          BLOBS_BUCKET: analytics-blobs
          KV_NAMESPACE: 0dda1ac5a883470b9f2f331308cad3e5
          QUEUE1_NAME: op3-donecast-queue1
          QUEUE2_NAME: op3-donecast-queue2

