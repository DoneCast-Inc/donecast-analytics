name: UUID identity recover (read-only)
# TEMPORARY, STRICTLY READ-ONLY.
#
# Reconstructs the mapping "OP3 show uuid -> real show identity" for the 28 show
# uuids that still have historical stats in R2, after the show-server Durable
# Object registry was wiped on 2026-08-27 with no backup.
#
# Every Cloudflare REST call here is a GET (bucket object list + object read).
# Every analytics.donecast.com call is a GET against /api/1/downloads/... which
# only reads stats/downloads/show-daily/*.tsv out of R2. There is no PUT, POST,
# DELETE, admin "update"/"delete" operation, or any other mutation anywhere in
# this file. Delete this workflow once the mapping has been captured.
on:
  push:
    branches: [claude/slack-session-9d7l6b]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ADMIN_TOKENS: ${{ secrets.ADMIN_TOKENS }}
      BUCKET: analytics-blobs
      ORIGIN: https://analytics.donecast.com
    steps:
      - name: Recover uuid -> identity mapping
        run: |
          set -u
          ADMIN_TOKEN=$(printf '%s' "${ADMIN_TOKENS:-}" | cut -d, -f1 | tr -d '[:space:]')
          if [ -n "$ADMIN_TOKEN" ]; then echo "::add-mask::$ADMIN_TOKEN"; fi
          export ADMIN_TOKEN
          python3 - <<'PY'
          import os, sys, json, hashlib, re, gzip, html, time
          import urllib.parse, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor

          API = 'https://api.cloudflare.com/client/v4'
          ACC = os.environ['CF_ACCOUNT_ID']
          TOK = os.environ['CF_API_TOKEN']
          BUCKET = os.environ['BUCKET']
          ORIGIN = os.environ['ORIGIN']
          ADMIN_TOKEN = os.environ.get('ADMIN_TOKEN') or ''

          UUIDS = """
          0cefce1bedc841829243206679bc37cd 130f6d958b664c9f8702e94500385e1d 21ef0bd92ef945259a346ac4e971897e
          22bf4f16a51047889a1ec17fc242a89d 298ee9a52ac24c31beab60c5e24f452d 31814805bacc4db48f6bf3c4070d341f
          323277debacf4700b10b088e845ca62a 35b065b8507b4d03bb758d6ac3ec29fe 384d34f7d88f4fbf81445853ac66391e
          4a7de62f8d5a4a93a28cde5fe50194bb 4d505ff1b7564b40b747378804e24c7a 5b6e8fb6330347b3a6a9ae607ee24e9b
          66c8f39415c04aed86c5fc751f39ca38 7830099bc82549f1b22a57945fe6148c 7838cf69ffaf4086b50d9112f099dea2
          84cccab9974649e3a056dd4bc1ca46d3 8f458a131a4e428e8dcadf7e61633c4a 99c14eedd5bd49a9a056be8b83ac53ae
          a525e200d35543caa80ec4c4c65e29f4 adebbec1820c47b3a49adb3e28d61a52 b1c53d222d2949bd9de0d657144af448
          c469ff220ad84c4a87ebf9f443e8dd3a c4a6940c55a54c8e82aab23793c10a00 e0bf959c0f3140b2a75ddf9b3c0ac52d
          e44e72e7891a41a88aeb26ab8965f035 eede09ae67794bb4b378c9dde1925894 f192660267e547318f8a1b5dbd0880ee
          f7f84828d2e64153982f5e797491edf9
          """.split()

          REQS = {'n': 0}

          def http_get(url, headers, timeout=20):
              REQS['n'] += 1
              req = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, str(e).encode()

          CF_HDRS = {'Authorization': 'Bearer ' + TOK}

          def r2_list(prefix, cap=100000):
              out, cursor = [], None
              while True:
                  q = {'per_page': '1000', 'prefix': prefix}
                  if cursor: q['cursor'] = cursor
                  url = '%s/accounts/%s/r2/buckets/%s/objects?%s' % (API, ACC, BUCKET, urllib.parse.urlencode(q))
                  code, body = http_get(url, CF_HDRS, timeout=30)
                  if code != 200:
                      print('  LIST FAIL prefix=%s http=%s %s' % (prefix, code, body[:300]))
                      return out
                  d = json.loads(body)
                  res = d.get('result') or []
                  if isinstance(res, dict): res = res.get('objects') or []
                  for o in res:
                      out.append({'key': o.get('key') or o.get('name'), 'size': o.get('size') or 0,
                                  'uploaded': o.get('uploaded') or o.get('last_modified') or ''})
                  ri = d.get('result_info') or {}
                  cursor = ri.get('cursor') or None
                  trunc = ri.get('is_truncated', ri.get('truncated', False))
                  if not cursor or not trunc or len(out) >= cap: break
              return out

          ENCODING = {'mode': None}

          def r2_get(key, timeout=25):
              modes = [ENCODING['mode']] if ENCODING['mode'] else ['plain', 'quoted']
              for m in modes:
                  name = key if m == 'plain' else urllib.parse.quote(key, safe='')
                  url = '%s/accounts/%s/r2/buckets/%s/objects/%s' % (API, ACC, BUCKET, name)
                  code, body = http_get(url, CF_HDRS, timeout=timeout)
                  if code == 200:
                      ENCODING['mode'] = m
                      if body[:2] == b'\x1f\x8b':
                          try: body = gzip.decompress(body)
                          except Exception: pass
                      return body
              return None

          def sha256hex(s):
              return hashlib.sha256(s.encode('utf-8')).hexdigest()

          print('#' * 70)
          print('### SECTION 0 - probe the R2 object GET endpoint (read-only)')
          print('#' * 70)
          probe = r2_list('stats/summaries/show/%s/' % UUIDS[0])
          print('probe list stats/summaries/show/%s/ -> %d key(s)' % (UUIDS[0], len(probe)))
          for p in probe[:5]: print('   ', p['key'], p['size'])
          if probe:
              b = r2_get(probe[0]['key'])
              print('probe object GET -> %s (encoding mode: %s)' % (('%d bytes' % len(b)) if b else 'FAILED', ENCODING['mode']))
              if b: print('   first 200 bytes:', b[:200])
          if ENCODING['mode'] is None:
              print('!! could not read R2 object content via REST; aborting content phases')

          print()
          print('#' * 70)
          print('### SECTION A - per-uuid stats/ facts (summaries + show-daily)')
          print('#' * 70)
          shows = {}
          def load_show(u):
              info = {'uuid': u, 'episodes': set(), 'months': [], 'daily_n': 0,
                      'daily_first': None, 'daily_last': None, 'hours': [], 'media': set(),
                      'smallest_daily': None, 'overall_key': None, 'downloads_total': 0}
              summ = r2_list('stats/summaries/show/%s/' % u)
              info['months'] = sorted(k['key'].split('-', 1)[1].replace('.summary.json', '')
                                      for k in summ if k['key'].endswith('.summary.json'))
              ov = [k for k in summ if k['key'].endswith('-overall.summary.json')]
              if ov:
                  info['overall_key'] = ov[0]['key']
                  b = r2_get(ov[0]['key'])
                  if b:
                      try:
                          j = json.loads(b)
                          info['episodes'] = set(j.get('episodes', {}).keys())
                          hrs = sorted(j.get('hourlyDownloads', {}).keys())
                          info['hours'] = [hrs[0], hrs[-1]] if hrs else []
                          info['downloads_total'] = sum(j.get('hourlyDownloads', {}).values())
                      except Exception as e:
                          print('  parse fail %s: %s' % (u, e))
              daily = r2_list('stats/downloads/show-daily/%s/' % u)
              info['daily_n'] = len(daily)
              if daily:
                  ds = sorted(k['key'][-14:-4] for k in daily)
                  info['daily_first'], info['daily_last'] = ds[0], ds[-1]
                  info['smallest_daily'] = min(daily, key=lambda k: k['size'])
              return info

          with ThreadPoolExecutor(max_workers=6) as ex:
              for info in ex.map(load_show, UUIDS):
                  shows[info['uuid']] = info

          # pull media (serverUrl) values straight out of one small show-daily tsv per uuid
          def load_media(u):
              info = shows[u]
              sd = info['smallest_daily']
              if not sd: return
              b = r2_get(sd['key'])
              if not b: return
              lines = b.decode('utf-8', 'replace').split('\n')
              if not lines: return
              hdr = lines[0].split('\t')
              try: idx = hdr.index('serverUrl')
              except ValueError: return
              for ln in lines[1:]:
                  if not ln.strip(): continue
                  parts = ln.split('\t')
                  if len(parts) > idx and parts[idx]:
                      info['media'].add(parts[idx])
                      if len(info['media']) >= 40: break

          with ThreadPoolExecutor(max_workers=6) as ex:
              list(ex.map(load_media, UUIDS))

          for u in UUIDS:
              i = shows[u]
              sd = i['smallest_daily']
              print('%s  months=%d dailyFiles=%d range=%s..%s episodes=%d downloads=%d' % (
                  u, len(i['months']), i['daily_n'], i['daily_first'], i['daily_last'],
                  len(i['episodes']), i['downloads_total']))
              print('   overallKey: %s' % i['overall_key'])
              print('   sampled daily: %s (%s bytes)' % (sd['key'] if sd else None, sd['size'] if sd else '-'))
              for m in sorted(i['media'])[:6]:
                  print('   media: %s' % m[:220])
              if len(i['media']) > 6: print('   ... %d more distinct media urls' % (len(i['media']) - 6))

          print()
          print('#' * 70)
          print('### SECTION B - feed/ prefix: keys + parsed feed identities')
          print('#' * 70)
          feeds_keys = r2_list('feed/')
          print('feed/ object count: %d' % len(feeds_keys))
          ok = []
          for k in feeds_keys:
              m = re.match(r'^feed/1\.([0-9a-f]{64})\.(\d+)\.(\d+)$', k['key'])
              if not m: continue
              if m.group(3) != '200': continue
              if k['size'] < 300: continue
              ok.append((m.group(2), k))
          ok.sort(key=lambda t: t[0], reverse=True)
          print('feed/ objects with status 200 and size>=300: %d' % len(ok))
          CAP = 450
          chosen = [k for _, k in ok[:CAP]]
          print('fetching newest %d of them' % len(chosen))

          # NOTE: the feed blob key is 1.<sha256(feedUrl + "?_t=<epochMillis>")>.<ts>.<status>
          # -- the feed URL is NOT recoverable from the key (cache-buster makes it
          # non-reproducible), so identity has to come from the blob CONTENT.

          TITLE_RE = re.compile(r'<title[^>]*>(.*?)</title>', re.S | re.I)
          PGUID_RE = re.compile(r'<podcast:guid[^>]*>\s*([^<\s]+)\s*</podcast:guid>', re.I)
          SELF_RE = re.compile(r'<atom:link[^>]*rel=["\']self["\'][^>]*>|<link[^>]*rel=["\']self["\'][^>]*>', re.I)
          HREF_RE = re.compile(r'href=["\']([^"\']+)["\']', re.I)
          NEWFEED_RE = re.compile(r'<itunes:new-feed-url[^>]*>\s*([^<\s]+)\s*</itunes:new-feed-url>', re.I)
          ITEM_RE = re.compile(r'<item[\s>].*?</item>', re.S | re.I)
          GUID_RE = re.compile(r'<guid[^>]*>(.*?)</guid>', re.S | re.I)
          ENC_RE = re.compile(r'<enclosure[^>]*url=["\']([^"\']+)["\']', re.I)
          CDATA_RE = re.compile(r'^\s*<!\[CDATA\[(.*?)\]\]>\s*$', re.S)

          def clean(t):
              m = CDATA_RE.match(t)
              if m: t = m.group(1)
              return t.strip()

          def parse_feed(blob):
              try: txt = blob.decode('utf-8', 'replace')
              except Exception: return None
              head = txt.split('<item', 1)[0]
              tm = TITLE_RE.search(head)
              title = html.unescape(clean(tm.group(1))) if tm else None
              pg = PGUID_RE.search(head)
              pguid = pg.group(1) if pg else None
              self_href = None
              sm = SELF_RE.search(head)
              if sm:
                  hm = HREF_RE.search(sm.group(0))
                  if hm: self_href = html.unescape(hm.group(1))
              nf = NEWFEED_RE.search(head)
              newfeed = nf.group(1) if nf else None
              eps, encs = set(), set()
              for item in ITEM_RE.findall(txt):
                  gm = GUID_RE.search(item)
                  if gm:
                      raw = clean(gm.group(1))
                      for variant in {raw, html.unescape(raw)}:
                          if variant: eps.add(sha256hex(variant[:8192]))
                  em = ENC_RE.search(item)
                  if em: encs.add(html.unescape(em.group(1)))
              return {'title': title, 'podcastGuid': pguid, 'self': self_href,
                      'newFeedUrl': newfeed, 'episodeIds': eps, 'enclosures': encs}

          def fetch_and_parse(k):
              b = r2_get(k['key'], timeout=25)
              if not b: return None
              p = parse_feed(b)
              if p: p['blobKey'] = k['key']; p['blobSize'] = k['size']
              return p

          parsed = []
          with ThreadPoolExecutor(max_workers=10) as ex:
              for p in ex.map(fetch_and_parse, chosen):
                  if p: parsed.append(p)
          print('parsed %d feed blobs' % len(parsed))

          # dedupe by (title, self)
          uniq = {}
          for p in parsed:
              key = (p['title'], p['self'], p['podcastGuid'])
              cur = uniq.get(key)
              if cur is None or len(p['episodeIds']) > len(cur['episodeIds']):
                  uniq[key] = p
              else:
                  cur['episodeIds'] |= p['episodeIds']
                  cur['enclosures'] |= p['enclosures']
          print('distinct feeds seen: %d' % len(uniq))
          print()
          print('--- all distinct feed identities in feed/ ---')
          for (t, s, g), p in sorted(uniq.items(), key=lambda kv: (kv[0][0] or '~')):
              print('  title=%r' % t)
              print('     self=%s' % s)
              print('     podcastGuid=%s  items=%d  enclosures=%d  sampleBlob=%s' % (g, len(p['episodeIds']), len(p['enclosures']), p['blobKey']))
              for e in sorted(p['enclosures'])[:2]:
                  print('     enclosure: %s' % e[:200])

          print()
          print('#' * 70)
          print('### SECTION C - live downloads API cross-check (GET, read-only)')
          print('#' * 70)
          if not ADMIN_TOKEN:
              print('(no admin token; skipping)')
          else:
              A_HDRS = {'Authorization': 'Bearer ' + ADMIN_TOKEN}
              def dl(u):
                  url = '%s/api/1/downloads/show/%s?start=2026-06&end=2026-09&limit=3&format=json' % (ORIGIN, u)
                  code, body = http_get(url, A_HDRS, timeout=20)
                  return u, code, body[:1200]
              with ThreadPoolExecutor(max_workers=4) as ex:
                  for u, code, body in ex.map(dl, UUIDS):
                      try:
                          j = json.loads(body)
                          rows = j.get('rows') or []
                          urls = sorted({r.get('url') for r in rows if isinstance(r, dict) and r.get('url')})
                          print('%s http=%s rows=%d %s' % (u, code, len(rows), urls[:3]))
                      except Exception:
                          print('%s http=%s raw=%s' % (u, code, body[:200]))

          print()
          print('#' * 70)
          print('### SECTION D - CROSS-REFERENCE TABLE')
          print('#' * 70)
          def media_keys(urls):
              out = set()
              for u in urls:
                  try:
                      p = urllib.parse.urlparse(u)
                      out.add((p.netloc, p.path))
                  except Exception:
                      pass
              return out

          for u in UUIDS:
              i = shows[u]
              eps = i['episodes']
              best = []
              for (t, s, g), p in uniq.items():
                  inter = len(eps & p['episodeIds'])
                  # media-url overlap: does any download serverUrl path appear as an enclosure?
                  mine = media_keys(i['media'])
                  theirs = media_keys(p['enclosures'])
                  minter = len(mine & theirs)
                  # also substring match of the media path inside enclosure urls
                  sub = 0
                  for (h, path) in mine:
                      if path and any(path in e for e in p['enclosures']): sub += 1
                  if inter or minter or sub:
                      best.append((inter, minter, sub, t, s, g, len(p['episodeIds'])))
              best.sort(reverse=True)
              print()
              print('UUID %s' % u)
              print('  episodes=%d  dailyFiles=%d  range=%s..%s  downloads=%d' % (
                  len(eps), i['daily_n'], i['daily_first'], i['daily_last'], i['downloads_total']))
              print('  distinctMediaUrls=%d  hosts=%s' % (
                  len(i['media']), sorted({urllib.parse.urlparse(m).netloc for m in i['media']})))
              for m in sorted(i['media'])[:3]:
                  print('    media: %s' % m[:200])
              if not best:
                  print('  MATCH: none')
              for b in best[:3]:
                  print('  MATCH episodeIdOverlap=%d mediaExact=%d mediaSubstr=%d feedItems=%d' % (b[0], b[1], b[2], b[6]))
                  print('        title=%r' % b[3])
                  print('        feedUrl(self)=%s' % b[4])
                  print('        podcastGuid=%s' % b[5])

          print()
          print('#' * 70)
          print('### SECTION E - "Cinema IRL" search')
          print('#' * 70)
          hits = [(t, s, g, p) for (t, s, g), p in uniq.items() if t and 'cinema' in t.lower()]
          print('feed titles containing "cinema": %d' % len(hits))
          for t, s, g, p in hits:
              print('  title=%r self=%s podcastGuid=%s items=%d' % (t, s, g, len(p['episodeIds'])))
              owners = [u for u in UUIDS if shows[u]['episodes'] & p['episodeIds']]
              print('  uuids whose overall-summary episodeIds intersect this feed: %s' % owners)
          allmedia = set()
          for u in UUIDS: allmedia |= shows[u]['media']
          cin = sorted(m for m in allmedia if 'cinema' in m.lower())
          print('download media urls containing "cinema": %d' % len(cin))
          for m in cin[:20]: print('  %s' % m[:200])

          print()
          print('total HTTP requests issued: %d' % REQS['n'])
          print('=== DONE ===')
          PY
