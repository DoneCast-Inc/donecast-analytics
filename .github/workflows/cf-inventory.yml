name: CF inventory (read-only)
# Read-only reconnaissance: which Cloudflare accounts can CF_API_TOKEN reach,
# and what OP3 storage lives in each. GET requests only.
on:
  workflow_dispatch:
  # The workflow_dispatch REST endpoint only resolves workflow files that exist
  # on the default branch, so this branch-scoped push trigger is what actually
  # lets the job run from here. Safe to drop once it lands on master.
  push:
    branches: [claude/slack-session-9d7l6b]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Inventory
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          jqq() { jq -r "$1" 2>/dev/null || echo "(unparseable)"; }

          echo "=== TOKEN VERIFY ==="
          curl -sS "${auth[@]}" "$API/user/tokens/verify" | jqq '{success, status: .result.status, errors}'

          echo
          echo "=== ACCOUNTS VISIBLE TO THIS TOKEN ==="
          accts_json=$(curl -sS "${auth[@]}" "$API/accounts?per_page=50")
          echo "$accts_json" | jqq '{success, count: (.result|length), errors}'
          echo "$accts_json" | jqq '.result[]? | "ACCOUNT\t\(.id)\t\(.name)"'

          ids=$(echo "$accts_json" | jq -r '.result[]?.id' 2>/dev/null)
          if [ -z "$ids" ]; then
            echo "(no accounts listed; falling back to CF_ACCOUNT_ID only)"
            ids="$CF_ACCOUNT_ID"
          fi

          for A in $ids; do
            echo
            echo "############################################################"
            echo "### ACCOUNT $A"
            name=$(echo "$accts_json" | jq -r --arg a "$A" '.result[]? | select(.id==$a) | .name' 2>/dev/null)
            echo "### name: ${name:-unknown}"
            if [ "$A" = "$CF_ACCOUNT_ID" ]; then echo "### ^ this is the CURRENT CF_ACCOUNT_ID (deploy target)"; fi
            echo "############################################################"

            echo "--- R2 buckets ---"
            curl -sS -w "\n[http %{http_code}]\n" "${auth[@]}" "$API/accounts/$A/r2/buckets" \
              | jqq '.result.buckets[]? | "R2BUCKET\t\(.name)\t\(.creation_date)"'
            curl -sS "${auth[@]}" "$API/accounts/$A/r2/buckets" | jqq '{success, errors}'

            echo "--- KV namespaces ---"
            curl -sS "${auth[@]}" "$API/accounts/$A/storage/kv/namespaces?per_page=100" \
              | jqq '.result[]? | "KVNS\t\(.id)\t\(.title)"'
            curl -sS "${auth[@]}" "$API/accounts/$A/storage/kv/namespaces?per_page=100" | jqq '{success, errors}'

            echo "--- Durable Object namespaces ---"
            curl -sS "${auth[@]}" "$API/accounts/$A/workers/durable_objects/namespaces" \
              | jqq '.result[]? | "DONS\t\(.id)\t\(.name)\t script=\(.script)\t class=\(.class)\t sqlite=\(.use_sqlite)"'
            curl -sS "${auth[@]}" "$API/accounts/$A/workers/durable_objects/namespaces" | jqq '{success, errors}'

            echo "--- Worker scripts ---"
            curl -sS "${auth[@]}" "$API/accounts/$A/workers/scripts" \
              | jqq '.result[]? | "SCRIPT\t\(.id)\t modified=\(.modified_on)"'

            echo "--- Queues ---"
            curl -sS "${auth[@]}" "$API/accounts/$A/queues" \
              | jqq '.result[]? | "QUEUE\t\(.queue_id)\t\(.queue_name)"'

            echo "--- Zones in this account ---"
            curl -sS "${auth[@]}" "$API/zones?account.id=$A&per_page=50" \
              | jqq '.result[]? | "ZONE\t\(.id)\t\(.name)\t status=\(.status)\t paused=\(.paused)"'
          done

          echo
          echo "=== DONE ==="
